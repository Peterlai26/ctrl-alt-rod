<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: a retro desktop. Scavenge = camera view of the infected desktop + taskbar. Survival = USB drive window + setup-wizard diary. Single retro-OS look by choice. */
:root{
  color-scheme: light;
  --desk:#2f8a8a; --desk-2:#26787a; --g:#c3c3c3; --g-hi:#dfdfdf; --g-lo:#808080; --g-dk:#0a0a0a;
  --navy:#1c2f8a; --navy-2:#3b6fd0; --ink:#1a1a1a; --ink-soft:#4a4a4a; --white:#ffffff; --tip:#fffde6;
  --virus:#6fd06a; --virus-dk:#2f8a3a; --red:#b3261e; --blue:#185fa5; --ok:#2f7a1f; --amber:#ffc94a;
  --f-ui:'Chakra Petch','Anuphan',system-ui,sans-serif;
  --f-body:'Anuphan',system-ui,sans-serif;
  --f-mono:ui-monospace,'Chakra Petch',monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--desk);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px dotted var(--ink);outline-offset:-5px}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
#stage{position:relative;height:100%;padding-inline:max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px));background:var(--desk);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:6px 6px}
#bg{position:absolute;inset:0;z-index:0;display:block}
.scr{position:relative;z-index:1;height:100%;padding-block:8px;overflow:auto}

/* retro primitives */
.win{background:var(--g);border:2px solid;border-color:var(--white) var(--g-dk) var(--g-dk) var(--white);box-shadow:inset -1px -1px var(--g-lo),inset 1px 1px var(--g-hi),4px 6px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;min-height:0}
.tb{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--navy),var(--navy-2));color:#fff;padding:3px 3px 3px 8px;font-family:var(--f-ui);font-weight:600;font-size:13.5px;line-height:1.2;flex:0 0 auto}
.tb .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb.red{background:linear-gradient(90deg,#7a1f1f,#c0453a)}
.tbx{width:36px;height:30px;flex:0 0 36px;padding:0;display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:22px;line-height:1;color:var(--ink)}
.tbx.x{font-size:0;position:relative}
.b95.tbx{padding:0}
.tbx .spk{width:24px;height:24px}
.chips{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:middle;margin-left:2px}
.chip{display:inline-flex;align-items:center;gap:2px;background:#fffde6;border:1.5px solid var(--ink);padding:0 6px 0 2px;font-family:var(--f-ui);font-weight:700;font-size:13px;line-height:1.5;color:var(--ok)}
.chip canvas{width:22px;height:22px}
.chip.neg{color:var(--red)}
.radio .ci{width:28px;height:28px;flex:0 0 28px;margin-left:2px}
.tbx.x::before,.tbx.x::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:4px;margin:-2px 0 0 -9px;background:var(--ink);transform:rotate(45deg)}
.tbx.x::after{transform:rotate(-45deg)}
.comic .tb{padding-right:50px}
.b95{background:var(--g);border:2px solid;border-color:var(--white) var(--g-dk) var(--g-dk) var(--white);box-shadow:inset -1px -1px var(--g-lo),inset 1px 1px var(--g-hi);padding:5px 14px;font-family:var(--f-ui);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.b95:active:not(:disabled),.b95.on{border-color:var(--g-dk) var(--white) var(--white) var(--g-dk);box-shadow:inset 1px 1px var(--g-lo),inset -1px -1px var(--g-hi)}
.b95.def{outline:1px solid var(--g-dk);outline-offset:0}
.b95:disabled{color:var(--g-lo);text-shadow:1px 1px 0 var(--white);cursor:not-allowed}
.inset{background:var(--white);border:2px solid;border-color:var(--g-lo) var(--white) var(--white) var(--g-lo);box-shadow:inset 1px 1px var(--g-dk)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* intro desktop */
.intro{position:relative;height:100%}
.titlewin{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(420px,86%)}
.titlewin .body{padding:16px 18px 14px;display:grid;gap:10px;justify-items:center;text-align:center}
.logo{font-family:var(--f-ui);font-weight:700;font-size:clamp(34px,7vw,56px);line-height:1;color:var(--navy);text-shadow:3px 3px 0 var(--white),5px 5px 0 rgba(0,0,0,.2);letter-spacing:.01em}
.logo em{font-style:normal;color:var(--red)}
.warn{display:flex;gap:10px;align-items:center;font-size:13.5px;text-align:left}
.warn i{flex:0 0 34px;height:30px;background:var(--amber);clip-path:polygon(50% 0,100% 100%,0 100%);position:relative;font-style:normal;animation:wblink 1s steps(2) infinite}
@keyframes wblink{50%{background:#ff7a3a}}
.warn i::after{content:"";position:absolute;left:50%;top:10px;width:4px;height:9px;margin-left:-2px;background:var(--ink);border-radius:1px}
.warn i::before{content:"";position:absolute;left:50%;top:22px;width:4px;height:4px;margin-left:-2px;background:var(--ink);border-radius:1px}
.prog{height:18px;width:100%;padding:2px;display:flex;gap:2px}
.prog span{flex:0 0 10px;background:var(--virus-dk);opacity:0;animation:pfill 4.5s steps(1) infinite}
@keyframes pfill{0%{opacity:0}8%,92%{opacity:1}100%{opacity:0}}
.titlewin.pop{animation:twin .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes twin{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.titlewin .tb.red{animation:tbflash 1.4s steps(2) infinite}
@keyframes tbflash{50%{background:linear-gradient(90deg,#c0453a,#ff6a4a)}}
.titlewin.shake{animation:tshake .5s linear}
@keyframes tshake{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(calc(-50% - 6px),calc(-50% + 2px))}40%{transform:translate(calc(-50% + 6px),calc(-50% - 2px))}60%{transform:translate(calc(-50% - 4px),-50%)}80%{transform:translate(calc(-50% + 4px),-50%)}}
.titlewin.bye{animation:tbye .35s ease-in forwards}
@keyframes tbye{to{transform:translate(-50%,-50%) scale(.1);opacity:0}}
.logo .gl{display:inline-block;animation:glitch 3s steps(1) infinite}
@keyframes glitch{0%,86%,100%{transform:none;text-shadow:3px 3px 0 var(--white),5px 5px 0 rgba(0,0,0,.2)}88%{transform:translate(-3px,1px) skewX(-8deg);text-shadow:-3px 0 0 #6fd06a,3px 0 0 #ff4a6a}92%{transform:translate(3px,-1px);text-shadow:3px 0 0 #6fd06a,-3px 0 0 #4ad0ff}}
.virusbug{position:absolute;width:26px;height:26px;pointer-events:none}
.desk-ico{position:absolute;left:14px;top:14px;display:grid;justify-items:center;gap:2px;background:transparent;border:0;padding:4px;color:#fff;font-family:var(--f-ui);font-weight:600;font-size:12px;text-shadow:1px 1px 0 #000;width:76px;z-index:2}
.desk-ico canvas{width:38px;height:38px}
.desk-ico:focus-visible span{outline:1px dotted #fff}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:6px;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));background:var(--g);border-top:2px solid var(--white);box-shadow:inset 0 1px var(--g-hi);z-index:5}
.startbtn{display:flex;align-items:center;gap:6px;padding:3px 10px;font-family:var(--f-ui);font-weight:700;font-size:15px}
.startbtn i{width:18px;height:18px;border-radius:5px;background:var(--amber);border:2px solid var(--ink)}
.startbtn.pulse{animation:sp 1.2s ease-in-out infinite}
@keyframes sp{50%{box-shadow:inset -1px -1px var(--g-lo),inset 1px 1px var(--g-hi),0 0 0 3px rgba(255,201,74,.8)}}
.tray{margin-left:auto;padding:3px 10px;font-family:var(--f-ui);font-weight:600;font-size:13px;background:var(--g);border:1px solid;border-color:var(--g-lo) var(--white) var(--white) var(--g-lo)}
.startmenu{position:absolute;left:6px;bottom:42px;width:230px;z-index:6;flex-direction:row}
.startmenu .side{width:30px;background:linear-gradient(0deg,var(--navy),var(--navy-2));color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-ui);font-weight:700;font-size:15px;padding:8px 0;text-align:right;letter-spacing:.04em}
.startmenu ul{list-style:none;margin:0;padding:3px;flex:1}
.mi{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;text-align:left;font-family:var(--f-ui);font-weight:600;font-size:15px}
.mi:hover,.mi:focus-visible{background:var(--navy);color:#fff;outline:0}
.mi canvas{width:24px;height:24px;flex:0 0 24px}
.mi:disabled{color:var(--g-lo)} .mi:disabled:hover{background:transparent;color:var(--g-lo)}
.sep{height:2px;margin:3px 4px;border-top:1px solid var(--g-lo);border-bottom:1px solid var(--white)}
.dlgwrap{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(0,0,0,.25);padding:12px}
.dlg{width:min(420px,100%);max-height:100%}
.dlg .body{padding:14px 16px;display:grid;gap:12px;overflow:auto}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;padding:0 14px 12px}
.lvl3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl3 .b95{padding:12px 6px;font-size:16px}
.howto{display:grid;gap:10px}
.howto div{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;font-size:13.5px}
.howto canvas{width:40px;height:40px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.gal div{padding:8px;text-align:center;font-family:var(--f-ui);font-weight:600;font-size:12.5px}
.gal div i{display:block;height:40px;margin-bottom:6px;background:var(--navy)}
.gal div.no i{background:repeating-linear-gradient(45deg,#9a9a9a 0 5px,#b4b4b4 5px 10px)}
.gal div.no{color:var(--g-lo)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;border:0;background:transparent;padding:2px 0;text-align:left}
.chk .bx{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;font-size:13px;line-height:1;font-weight:700}
.chk:disabled{color:var(--g-lo);cursor:not-allowed}

/* scavenge */
.scv{display:flex;flex-direction:column;height:100%;gap:0}
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox canvas#mapc{position:absolute;inset:0;width:100%;height:100%;display:block}
.miniwin{position:absolute;left:8px;top:8px;z-index:3}
.miniwin .tb{font-size:11.5px;padding:1px 6px}
#mini{display:block;background:#1d4a4a}
.joy{position:absolute;left:14px;bottom:14px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.7);touch-action:none;z-index:3}
.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:12px;background:var(--g);border:2px solid;border-color:var(--white) var(--g-dk) var(--g-dk) var(--white);box-shadow:inset -2px -2px var(--g-lo),inset 2px 2px var(--g-hi),0 4px 0 rgba(0,0,0,.3)}
.actbtn{position:absolute;right:14px;bottom:14px;width:98px;height:98px;border-radius:24px;z-index:3;display:grid;place-content:center;text-align:center;line-height:1.05;padding:6px;background:var(--amber);border:3px solid;border-color:#fff2c4 #6b4f12 #6b4f12 #fff2c4;box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none}
.actbtn b{font-family:var(--f-ui);font-weight:700;font-size:21px}
.actbtn small{font-size:11px;display:block;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.actbtn:disabled{background:rgba(195,195,195,.55);border-color:rgba(255,255,255,.5);color:rgba(26,26,26,.5);box-shadow:none}
.actbtn.pulse{animation:apulse 1s ease-in-out infinite}
@keyframes apulse{50%{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 8px rgba(255,201,74,.45)}}
.count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.count .win{min-width:200px}
.count .body{padding:14px 20px;text-align:center;font-family:var(--f-ui);font-weight:700;font-size:56px;line-height:1;color:var(--navy)}
.count small{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-top:6px}
.stb{flex:0 0 auto;height:48px;display:flex;align-items:center;gap:6px;padding:4px 6px;background:var(--g);border-top:2px solid var(--white);box-shadow:inset 0 1px var(--g-hi)}
.stb .lbl{font-family:var(--f-ui);font-weight:600;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.bag{display:flex;gap:3px}
.slot{width:36px;height:36px;display:grid;place-items:center}
.slot.wide{width:75px}
.hint{flex:1;min-width:0;height:36px;padding:3px 8px;font-size:13px;line-height:1.25;display:flex;align-items:center;overflow:hidden;background:var(--tip)}
.hint.bad{color:var(--red)}
.depn{font-family:var(--f-ui);font-weight:700;font-size:15px;min-width:20px;text-align:center}
.clock{padding:4px 10px;font-family:var(--f-ui);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.clock.hot{color:var(--red);animation:wob .4s steps(2) infinite}
@keyframes wob{50%{background:#ffd6d0}}
.fly{position:fixed;z-index:60;pointer-events:none;transition:transform .45s cubic-bezier(.45,-.35,.6,1);filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}

/* summary */
.sum{display:grid;place-items:center;min-height:100%}
.sum .win{width:min(640px,100%)}
.sum .body{padding:14px 16px;display:grid;gap:12px}
.icons{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.ic{display:grid;justify-items:center;gap:1px;width:58px;font-size:11px;line-height:1.15;text-align:center}
.ic canvas{width:40px;height:40px}
.ic b{font-family:var(--f-ui)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{padding:6px;text-align:center}
.stats b{display:block;font-family:var(--f-ui);font-weight:700;font-size:22px;line-height:1.1}
.stats span{font-size:12px;color:var(--ink-soft)}

/* day */
.dayg{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.95fr);gap:10px;height:100%}
.dayg.closed{grid-template-columns:minmax(0,1fr)}
.dayg.closed .wiz{display:none}
.roomwin{min-width:0}
.roomwin .tb .hud{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:500}
.infb{width:70px;height:10px;background:#0b2a12;border:1px solid #fff;display:inline-block;vertical-align:middle}
.infb span{display:block;height:100%;background:var(--virus)}
.roombody{flex:1;min-height:0;overflow:hidden;position:relative;display:grid;place-items:center;padding:4px;background:#0f2424}
.roombody canvas{display:block;cursor:pointer;touch-action:none}
.rescue{position:absolute;left:8px;top:8px;padding:2px 8px;font-family:var(--f-ui);font-weight:600;font-size:12.5px;background:var(--tip);border:1px solid var(--ink)}
.openbook{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;align-items:center}
.openbook i{width:16px;height:16px;background:var(--navy);border:2px solid var(--ink)}
.wiz{min-width:0}
.wizbody{flex:1;min-height:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:8px}
.banner{background:linear-gradient(180deg,var(--navy),#0e1a55);color:#fff;padding:10px 8px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-ui);font-size:12.5px;font-weight:600;overflow:hidden}
.banner canvas{width:56px;height:56px;align-self:center}
.banner ol{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.banner li{opacity:.55;display:flex;gap:6px;align-items:baseline}
.banner li.on{opacity:1;color:var(--amber)}
.banner li.done{opacity:.85}
.banner li b{font-weight:700;width:12px}
.wizpage{min-height:0;overflow:auto;padding:10px 12px}
.wizpage.anim{animation:slide .28s steps(4)}
@keyframes slide{from{opacity:.2;transform:translateX(12px)}to{opacity:1;transform:none}}
.wizpage h2{font-family:var(--f-ui);font-weight:700;font-size:18px;color:var(--navy);margin-bottom:6px}
.log p{font-family:var(--f-mono);font-size:13.5px;line-height:1.5;padding:4px 0 4px 18px;position:relative;border-bottom:1px dotted #bbb}
.log p::before{content:">";position:absolute;left:2px;color:var(--g-lo)}
.log p.bad{color:var(--red)} .log p.good{color:var(--ok)}
.log b{color:var(--red);font-weight:700}
.evtxt{font-size:14.5px;line-height:1.55;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.evtxt canvas{flex:0 0 44px;width:44px;height:44px}
.choices{display:grid;gap:4px;margin:6px 0}
.radio{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:5px 4px;text-align:left;font-size:14.5px;line-height:1.3}
.radio .dot{width:16px;height:16px;flex:0 0 16px;border-radius:50%;background:#fff;border:2px solid;border-color:var(--g-lo) var(--white) var(--white) var(--g-lo);box-shadow:inset 1px 1px var(--g-dk);display:grid;place-items:center}
.radio.on .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.radio.on span:not(.dot){outline:1px dotted var(--ink);outline-offset:2px}
.radio small{margin-left:auto;font-size:11.5px;color:var(--g-lo);white-space:nowrap}
.radio:disabled{color:var(--g-lo);cursor:not-allowed}
.note{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.35}
.note.blue{color:var(--blue)}
.res{display:flex;gap:16px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.res div{display:flex;gap:6px;align-items:center;font-family:var(--f-ui);font-weight:600}
.res b{font-size:18px}
.res .low b{color:var(--red)}
.drag{display:inline-grid;place-items:center;width:38px;height:38px;cursor:grab;touch-action:none}
.drag canvas{pointer-events:none}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;margin:2px 0 4px}
.lk{border:0;background:transparent;padding:0;color:var(--blue);text-decoration:underline;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-family:var(--f-ui);font-weight:600;font-size:12px;text-align:left;padding:4px;background:var(--g);border-bottom:1px solid var(--g-lo)}
.tbl td{padding:5px 4px;border-bottom:1px dotted #bbb;vertical-align:middle}
.tbl tr.focus td{background:#fff3b8}
.who{display:flex;gap:8px;align-items:center}
.who canvas{width:34px;height:34px;flex:0 0 34px}
.who b{font-family:var(--f-ui);font-weight:700;font-size:14px;display:block;line-height:1.1}
.who small{font-size:11.5px;color:var(--ink-soft)}

<script>
(function(){
"use strict";
/* ================= ART: 3D sticker apps, items, iso helpers ================= */
const INK = '#2b2b2b';
const DPR = () => Math.min(2, window.devicePixelRatio||1);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function rr(c,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function stk(c,w,col){ c.lineWidth=w; c.strokeStyle=col||INK; c.lineJoin='round'; c.lineCap='round'; c.stroke(); }
function fs(c,fill,w){ c.fillStyle=fill; c.fill(); if(w) stk(c,w); }
function txt(c,t,x,y,size,col,weight,align){ c.font=`${weight||500} ${size}px Anuphan, system-ui, sans-serif`; c.fillStyle=col||INK; c.textAlign=align||'center'; c.textBaseline='middle'; c.fillText(t,x,y); }
function shade(hex,a){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const t=a<0?0:255,p=Math.abs(a); r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p); return `rgb(${r},${g},${b})`; }
function grad(c,x0,y0,x1,y1,col){ const g=c.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,shade(col,.25)); g.addColorStop(1,shade(col,-.14)); return g; }

/* ---------- 3D chip helper: slab with thickness + gloss ---------- */
function slab(c,x,y,w,h,r,col,d,lw){
  d=d==null?Math.min(w,h)*.12:d; lw=lw||Math.max(1.2,Math.min(w,h)*.045);
  rr(c,x+d*.35,y+d,w,h,r); c.fillStyle=shade(col,-.42); c.fill(); stk(c,lw);
  rr(c,x,y,w,h,r); c.fillStyle=grad(c,x,y,x+w,y+h,col); c.fill(); stk(c,lw);
  c.save(); rr(c,x,y,w,h,r); c.clip(); c.beginPath(); c.ellipse(x+w*.32,y+h*.08,w*.55,h*.22,-.15,0,7); c.fillStyle='rgba(255,255,255,.3)'; c.fill(); c.restore();
}

/* ---------- items ---------- */
const ICON = {
  mama(c,x,y,s){ // RAM stick
    slab(c,x-s*.42,y-s*.17,s*.84,s*.3,s*.04,'#3fa36b');
    c.fillStyle='#1f2a24'; for(let i=0;i<4;i++) c.fillRect(x-s*.34+i*s*.18,y-s*.1,s*.12,s*.15);
    c.fillStyle='#e0b93a'; for(let i=0;i<9;i++) c.fillRect(x-s*.38+i*s*.085,y+s*.13,s*.045,s*.07); },
  rice(c,x,y,s){ // big RAM board
    slab(c,x-s*.44,y-s*.3,s*.88,s*.56,s*.05,'#2f8f5b');
    c.fillStyle='#1f2a24'; for(let r2=0;r2<2;r2++) for(let i=0;i<4;i++) c.fillRect(x-s*.36+i*s*.19,y-s*.22+r2*s*.2,s*.13,s*.15);
    txt(c,'16G',x,y+s*.36,s*.18,'#fff',700); },
  fishcan(c,x,y,s){ // cache chip
    slab(c,x-s*.3,y-s*.3,s*.6,s*.6,s*.06,'#7c5cd6');
    c.strokeStyle='#d9c96b'; c.lineWidth=s*.04; c.beginPath(); for(let i=0;i<4;i++){ const o=-s*.21+i*s*.14; c.moveTo(x+o,y-s*.3); c.lineTo(x+o,y-s*.4); c.moveTo(x+o,y+s*.3); c.lineTo(x+o,y+s*.38); } c.stroke();
    txt(c,'C',x,y,s*.3,'#fff',700); },
  water(c,x,y,s){ // battery pack
    for(let i=-1;i<=1;i++){ const bx=x+i*s*.25; slab(c,bx-s*.11,y-s*.3,s*.22,s*.6,s*.06,'#ffc94a',s*.05); c.fillStyle=INK; c.fillRect(bx-s*.04,y-s*.36,s*.08,s*.06); c.fillStyle='rgba(43,43,43,.75)'; c.fillRect(bx-s*.08,y+s*.05,s*.16,s*.06); } },
  bottle(c,x,y,s){ // single cell
    slab(c,x-s*.15,y-s*.3,s*.3,s*.62,s*.07,'#ffc94a',s*.05); c.fillStyle=INK; c.fillRect(x-s*.05,y-s*.38,s*.1,s*.08);
    c.beginPath(); c.moveTo(x+s*.03,y-s*.18); c.lineTo(x-s*.07,y+s*.02); c.lineTo(x+s*.01,y+s*.02); c.lineTo(x-s*.03,y+s*.2); c.lineTo(x+s*.08,y-s*.02); c.lineTo(x,y-s*.02); c.closePath(); c.fillStyle=INK; c.fill(); },
  radio(c,x,y,s){ // notification box (bell)
    slab(c,x-s*.34,y-s*.28,s*.68,s*.56,s*.12,'#4aa8ff');
    c.beginPath(); c.moveTo(x-s*.14,y+s*.1); c.quadraticCurveTo(x-s*.14,y-s*.18,x,y-s*.18); c.quadraticCurveTo(x+s*.14,y-s*.18,x+s*.14,y+s*.1); c.closePath(); fs(c,'#fff',s*.035); c.beginPath(); c.arc(x,y+s*.14,s*.04,0,7); c.fillStyle='#fff'; c.fill();
    c.beginPath(); c.arc(x+s*.26,y-s*.24,s*.09,0,7); fs(c,'#e8504a',s*.03); },
  flash(c,x,y,s){ // ping antenna
    slab(c,x-s*.22,y+s*.06,s*.44,s*.24,s*.05,'#8a96a3',s*.05);
    c.beginPath(); c.moveTo(x,y+s*.06); c.lineTo(x,y-s*.26); stk(c,s*.06); c.beginPath(); c.arc(x,y-s*.28,s*.06,0,7); fs(c,'#e8504a',s*.03);
    [.16,.26].forEach(r2=>{ c.beginPath(); c.arc(x,y-s*.28,s*r2,-1,-.3); stk(c,s*.04,'#3fa36b'); c.beginPath(); c.arc(x,y-s*.28,s*r2,Math.PI+.3,Math.PI+1); stk(c,s*.04,'#3fa36b'); }); },
  med(c,x,y,s){ // antivirus shield
    c.beginPath(); c.moveTo(x+s*.03,y-s*.34+s*.06); c.lineTo(x+s*.33,y-s*.22+s*.06); c.quadraticCurveTo(x+s*.33,y+s*.22+s*.06,x+s*.03,y+s*.38+s*.06); c.quadraticCurveTo(x-s*.27,y+s*.22+s*.06,x-s*.27,y-s*.22+s*.06); c.closePath(); c.fillStyle='#1f6a8a'; c.fill(); stk(c,s*.045);
    c.beginPath(); c.moveTo(x,y-s*.34); c.lineTo(x+s*.3,y-s*.22); c.quadraticCurveTo(x+s*.3,y+s*.22,x,y+s*.38); c.quadraticCurveTo(x-s*.3,y+s*.22,x-s*.3,y-s*.22); c.closePath(); c.fillStyle=grad(c,x-s*.3,y-s*.3,x+s*.3,y+s*.3,'#3fb6e0'); c.fill(); stk(c,s*.045);
    c.fillStyle='#fff'; c.fillRect(x-s*.05,y-s*.17,s*.1,s*.34); c.fillRect(x-s*.17,y-s*.05,s*.34,s*.1); },
  spray(c,x,y,s){ // popup blocker (stop sign)
    c.beginPath(); for(let i=0;i<8;i++){ const a=Math.PI/8+i*Math.PI/4; c.lineTo(x+s*.04+Math.cos(a)*s*.34,y+s*.05+Math.sin(a)*s*.34);} c.closePath(); c.fillStyle='#8f2a22'; c.fill(); stk(c,s*.04);
    c.beginPath(); for(let i=0;i<8;i++){ const a=Math.PI/8+i*Math.PI/4; c.lineTo(x+Math.cos(a)*s*.34,y+Math.sin(a)*s*.34);} c.closePath(); c.fillStyle=grad(c,x-s*.3,y-s*.3,x+s*.3,y+s*.3,'#e8504a'); c.fill(); stk(c,s*.04);
    rr(c,x-s*.2,y-s*.06,s*.4,s*.12,s*.03); c.fillStyle='#fff'; c.fill(); },
  ring(c,x,y,s){ // VPN key-lock
    slab(c,x-s*.26,y-s*.06,s*.52,s*.4,s*.08,'#3fa36b');
    c.beginPath(); c.arc(x,y-s*.06,s*.17,Math.PI,0); stk(c,s*.08,INK); c.beginPath(); c.arc(x,y-s*.06,s*.17,Math.PI,0); stk(c,s*.045,'#c3c3c3');
    c.beginPath(); c.arc(x,y+s*.1,s*.06,0,7); c.fillStyle=INK; c.fill(); txt(c,'VPN',x,y+s*.25,s*.13,'#fff',700); },
  rope(c,x,y,s){ // LAN cable coil
    c.beginPath(); for(let i=0;i<3;i++){ c.moveTo(x+s*(.32-i*.08),y+s*.04); c.ellipse(x,y+s*.04,s*(.32-i*.08),s*(.2-i*.05),0,0,7);} stk(c,s*.08,INK); c.beginPath(); for(let i=0;i<3;i++){ c.moveTo(x+s*(.32-i*.08),y+s*.04); c.ellipse(x,y+s*.04,s*(.32-i*.08),s*(.2-i*.05),0,0,7);} stk(c,s*.05,'#4aa8ff');
    slab(c,x+s*.18,y-s*.34,s*.18,s*.16,s*.02,'#e8eef2',s*.03); },
  paddle(c,x,y,s){ // firewall
    const bw=s*.24, bh=s*.13;
    for(let r2=0;r2<4;r2++) for(let i=0;i<3;i++){ const ox=(r2%2?bw/2:0); const bx=x-s*.4+ox+i*bw; if(bx+bw>x+s*.44) continue; slab(c,bx,y-s*.08+r2*bh,bw-2,bh-2,2,'#c4553b',2,1.2); }
    c.beginPath(); c.moveTo(x-s*.18,y-s*.08); c.quadraticCurveTo(x-s*.26,y-s*.3,x-s*.08,y-s*.42); c.quadraticCurveTo(x-s*.06,y-s*.24,x+s*.04,y-s*.3); c.quadraticCurveTo(x+s*.06,y-s*.46,x+s*.18,y-s*.38); c.quadraticCurveTo(x+s*.3,y-s*.22,x+s*.2,y-s*.08); c.closePath(); c.fillStyle='#ffb347'; c.fill(); stk(c,s*.035); },
  bucket(c,x,y,s){ // capacitor

  cards(c,x,y,s){ c.save(); c.translate(x,y); c.rotate(-.25); slab(c,-s*.28,-s*.32,s*.38,s*.54,s*.05,'#f7f4ee',s*.04); c.rotate(.45); slab(c,-s*.1,-s*.3,s*.38,s*.54,s*.05,'#f7f4ee',s*.04); txt(c,'♥',s*.09,-s*.03,s*.24,'#cf3b2b',700); c.restore(); },
  power(c,x,y,s){ // 4G modem
    slab(c,x-s*.32,y-s*.12,s*.64,s*.36,s*.08,'#f4efe2');
    c.fillStyle='#3fa36b'; for(let i=0;i<4;i++) c.fillRect(x-s*.2+i*s*.08,y+s*.12-i*s*.05,s*.05,s*.05+i*s*.05);
    txt(c,'4G',x+s*.14,y+s*.06,s*.14,INK,700); c.beginPath(); c.moveTo(x+s*.22,y-s*.12); c.lineTo(x+s*.3,y-s*.38); stk(c,s*.05); },
  raft(c,x,y,s){ slab(c,x-s*.38,y-s*.22,s*.76,s*.44,s*.2,'#6b7a8f'); c.beginPath(); c.ellipse(x,y,s*.18,s*.12,0,0,7); c.fillStyle='#1b2430'; c.fill(); txt(c,'proxy',x,y+s*.3,s*.12,'#fff',700); },
  boat(c,x,y,s){ slab(c,x-s*.12,y-s*.34,s*.24,s*.18,s*.03,'#c3c3c3',s*.04); slab(c,x-s*.2,y-s*.16,s*.4,s*.46,s*.08,'#ff8a3d'); }

function floorTile(c,x,y,w,h,cs,col){
  c.fillStyle=col; c.fillRect(x,y,w,h);
  c.strokeStyle='rgba(43,43,43,.09)'; c.lineWidth=1; c.beginPath(); for(let xx=x;xx<=x+w;xx+=cs/2){ c.moveTo(xx,y); c.lineTo(xx,y+h);} for(let yy=y;yy<=y+h;yy+=cs/2){ c.moveTo(x,yy); c.lineTo(x+w,yy);} c.stroke();
  c.fillStyle='rgba(255,255,255,.35)'; for(let yy=y+cs/4;yy<y+h;yy+=cs) for(let xx=x+cs/4;xx<x+w;xx+=cs) c.fillRect(xx,yy,2,2);
}

/* ---------- isometric projection ---------- */
function Iso(tw,ox,oy,d){
  const th=tw/2;
  const P=(u,v,z)=>[ox+(u-v)*tw/2, oy+(u+v)*th/2-(z||0)];
  const poly=(c,pts)=>{ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath(); };
  return { tw, th, ox, oy, d, P, poly,
    inv(sx,sy,z){ const X=(sx-ox)/(tw/2), Y=(sy-oy+(z||0))/(th/2); return [(X+Y)/2,(Y-X)/2]; },
    plane(c,z,cs){ c.setTransform(d*tw/2/cs, d*th/2/cs, -d*tw/2/cs, d*th/2/cs, d*ox, d*(oy-(z||0))); },
    reset(c){ c.setTransform(d,0,0,d,0,0); },
    box(c,u,v,w,h,zh,col,o){ o=o||{}; const z0=o.z0||0, z1=z0+zh;
      const L=[P(u,v+h,z0),P(u+w,v+h,z0),P(u+w,v+h,z1),P(u,v+h,z1)], R=[P(u+w,v,z0),P(u+w,v+h,z0),P(u+w,v+h,z1),P(u+w,v,z1)], T=[P(u,v,z1),P(u+w,v,z1),P(u+w,v+h,z1),P(u,v+h,z1)];
      const lw=o.lw==null?1.2:o.lw;
      if(o.left!==false){ poly(c,L); c.fillStyle=o.leftCol||shade(col,-.16); c.fill(); if(lw) stk(c,lw,o.ink); }
      if(o.right!==false){ poly(c,R); c.fillStyle=o.rightCol||shade(col,-.34); c.fill(); if(lw) stk(c,lw,o.ink); }
      if(o.top!==false){ poly(c,T); c.fillStyle=o.topCol||col; c.fill(); if(lw) stk(c,lw,o.ink); }
      return {L,R,T}; }
  };
}

/* ---------- sprite cache ---------- */
const SPR = new Map();
function drawThing(c,id,x,y,s,mood){
  if(LOOK[id]) drawIcon3D(c,id,x-s*.03,y-s*.04,s*.66,mood||'ok');
  else if(id==='cat') drawCat(c,x,y+s*.3,s*.7,false,0);
  else if(ICON[id]) ICON[id](c,x,y,s);
}
function sprite(id,px,mood){
  px=Math.max(8,Math.round(px)); const k=id+'|'+px+'|'+(mood||''); let cv=SPR.get(k); if(cv) return cv;
  const d=DPR(); cv=document.createElement('canvas'); cv.width=cv.height=Math.ceil(px*d); const c=cv.getContext('2d'); c.scale(d,d);
  drawThing(c,id,px/2,px/2,px*.88,mood);
  SPR.set(k,cv); return cv;
}
function iconCanvas(id,size,mood){ const s=sprite(id,size,mood), cv=document.createElement('canvas'); cv.width=s.width; cv.height=s.height; cv.style.width=size+'px'; cv.style.height=size+'px'; cv.getContext('2d').drawImage(s,0,0); return cv; }

function tone(f,dur,type,vol,slide){ if(!AC||muted) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.06,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.05); }
function noise(dur,vol,freq){ if(!AC||muted) return; const t=AC.currentTime, n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n); const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||900; const g=AC.createGain(); g.gain.value=vol||.06; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); }

/* ---------------- coach marks ---------------- */
function coach(steps,done){
  const el=$('coach'); let i=0;
  const render=()=>{
    if(i>=steps.length){ el.hidden=true; el.innerHTML=''; done&&done(); return; }
    const s=steps[i], vw=innerWidth, vh=innerHeight, M=8;
    let p=null; try{ p=s.at(); }catch(e){}
    if(!p){ p={x:vw/2,y:vh/2,w:0,h:0}; }
    // ring = rectangle around target, clipped to the viewport
    let rw=p.w!=null?p.w+12:(p.r||28)*2, rh=p.h!=null?p.h+12:(p.r||28)*2;
    let rx=p.x-rw/2, ry=p.y-rh/2;
    const x0=Math.max(4,rx), y0=Math.max(4,ry), x1=Math.min(vw-4,rx+rw), y1=Math.min(vh-4,ry+rh);
    rx=x0; ry=y0; rw=Math.max(0,x1-x0); rh=Math.max(0,y1-y0);
    const tw=Math.min(300,vw-2*M);
    el.hidden=false;
    el.innerHTML=`${rw>0?`<div class="cring" style="left:${rx}px;top:${ry}px;width:${rw}px;height:${rh}px"></div>`:''}
      <div class="ctip win" style="left:-9999px;top:0;width:${tw}px"><div class="tb"><span class="t">วิธีเล่น ${i+1}/${steps.length}</span></div><div class="body"><p>${s.text}</p>
      <div class="row"><button class="b95" data-coach="skip">ข้าม</button><button class="b95 def" data-coach="next">${i===steps.length-1?(s.last||'ตกลง'):'ถัดไป >'}</button></div></div></div>`;
    const tip=el.querySelector('.ctip'), th=Math.min(tip.offsetHeight, vh-2*M), G=10;
    const fitsX=x=>x>=M&&x+tw<=vw-M, fitsY=y=>y>=M&&y+th<=vh-M;
    const cx=clamp(p.x-tw/2,M,vw-tw-M), cy=clamp(p.y-th/2,M,vh-th-M);
    const cand=[
      [cx, ry+rh+G], [cx, ry-G-th],              // below, above
      [rx+rw+G, cy], [rx-G-tw, cy]               // right, left
    ];
    let pos=cand.find(([x,y])=>fitsX(x)&&fitsY(y));
    if(!pos){ // no clean spot: pick the corner farthest from the target
      const corners=[[M,M],[vw-tw-M,M],[M,vh-th-M],[vw-tw-M,vh-th-M]];
      pos=corners.reduce((b,c)=>{ const d=Math.hypot(c[0]+tw/2-p.x,c[1]+th/2-p.y); return d>b.d?{c,d}:b; },{c:corners[0],d:-1}).c;
    }
    tip.style.left=pos[0]+'px'; tip.style.top=pos[1]+'px'; tip.style.maxHeight=(vh-2*M)+'px';
    const nb=tip.querySelector('[data-coach="next"]'); try{ nb.focus({preventScroll:true}); }catch(e){}
  };
  el.onclick=e=>{ const b=e.target.closest('[data-coach]'); if(!b) return; sfx('click'); if(b.dataset.coach==='skip') i=steps.length; else i++; render(); };
  el.onkeydown=e=>{ if(e.key==='Escape'){ i=steps.length; render(); } };
  COACH_RENDER=()=>{ if(!el.hidden) render(); };
  render();
}
let COACH_RENDER=null;
function elPt(el,r0){ if(!el) return null; const r=el.getBoundingClientRect(); if(!r.width&&!r.height) return null; const o={x:r.left+r.width/2, y:r.top+r.height/2}; if(r0){ o.r=r0; } else { o.w=r.width; o.h=r.height; } return o; }

  const used = new Set([key(...MAP.start)]);
  const cellsIn = r => { const out=[]; const R=ROOMRECT[r]; for(let y=R.y0;y<=R.y1;y++) for(let x=R.x0;x<=R.x1;x++){ const k=key(x,y); if(passable(x,y)&&!STAIR.has(k)&&!DOORCELL.has(k)&&!used.has(k)) out.push([x,y]); } return out; };

function newGame(dep,lost,missing){
  const has0=id=>dep.includes(id);
  const s={ diff:diffKey, day:1,
    food: dep.reduce((a,id)=>a+(DEF[id].food||0),0),
    water: dep.reduce((a,id)=>a+(DEF[id].water||0),0),
    tools:{radio:has0('radio'),flash:has0('flash'),med:has0('med')?2:0,spray:has0('spray'),ring:has0('ring'),rope:has0('rope'),paddle:has0('paddle'),bucket:has0('bucket'),cards:has0('cards'),power:has0('power')?1:0,raft:false,boat:false},
    cat:has0('cat'), catAway:0, m:{}, rat:{}, plan:null, exp:null,
    ev:null, evResult:null, choice:null, report:[], rescueDay:null, missed:0, sched:[], used:{}, flags:{}, crocUntil:0, noExp:0, rain:false,
    evac:missing.slice(), dead:[], over:null, page:0, log:[] };
  Object.keys(PEOPLE).forEach(id=>{ const h=id==='ek'||has0(id); s.m[id]={alive:h,here:h,hunger:0,thirst:0,sick:false,sickDays:0,stress:false,stressDays:0,away:false}; });
  s.report=[{t:'คืนแรกในแฟลชไดรฟ์ ไดรฟ์ถูกถอดแยกจากเครื่องแล้ว ข้างนอกเงียบสนิท'}];
  if(s.cat) s.report.push({t:'เคอร์เซอร์นอนหลับบนตู้แร็ค ไม่รู้ร้อนรู้หนาว'});
  if(lost.length) s.report.push({t:`เสียดาย${lost.map(id=>DEF[id].n).join(' ')}ที่ติดไวรัสไป`,c:'bad'});
  s.log.push({d:1,t:`หนีเข้าแฟลชไดรฟ์ได้ ${1+dep.filter(id=>DEF[id].k==='person').length} แอพ`});
  return s;
}
function here(){ return Object.keys(S.m).filter(id=>{ const m=S.m[id]; return m.alive&&m.here&&!m.away; }); }
function kids(){ return here().filter(id=>PEOPLE[id].kid); }
function has(id){ return here().includes(id); }
function nm(id){ return PEOPLE[id] ? PEOPLE[id].name : ''; }
function sick(id){ if(!id||!S.m[id]) return; const m=S.m[id]; if(!m.sick){ m.sick=true; m.sickDays=0; } }
function stress(id){ if(!id||!S.m[id]) return; const m=S.m[id]; if(!m.stress){ m.stress=true; m.stressDays=0; } }
function unstress(w){ (w==='all'?here():[w]).forEach(id=>{ if(S.m[id]){ S.m[id].stress=false; S.m[id].stressDays=0; } }); }
function sched(d,type){ S.sched.push({day:S.day+d,type}); }
function logIt(t){ const clean=t.replace(/<span class="chips">[\s\S]*?<!--\/c-->/g,'').replace(/<[^>]+>/g,'').replace(/\s*\(.*?\)\s*$/,''); S.log.push({d:S.day,t:clean.length>70?clean.slice(0,68)+'…':clean}); if(S.log.length>40) S.log.shift(); }
function fx(f,w){ f=f||0; w=w||0; if(f<0) f=-Math.min(-f,S.food); if(w<0) w=-Math.min(-w,S.water); S.food+=f; S.water+=w;
  const p=[]; if(f) p.push(chip('mama',f)); if(w) p.push(chip('bottle',w)); return chips(p); }
function chip(id,n){ return `<span class="chip ${n<0?'neg':''}"><canvas data-icon="${id}"></canvas>${n>0?'+':'−'}${Math.abs(n)}</span>`; }
function chips(arr){ return arr.length?` <span class="chips">${arr.join('')}</span><!--/c-->`:''; }
function waterLevel(d){ const R=D().recede, peak=Math.round(R*.4); return Math.max(0,Math.round(d<=peak ? 80+d*(110/peak) : 190-(d-peak)*(190/(R-peak)))); }
function infPct(d){ return clamp(Math.round(waterLevel(d)/190*100),0,100); }
function evDef(){ if(!S.ev) return null; if(S.ev.id==='rescue') return RESCUE; return EVENTS.find(e=>e.id===S.ev.id)||null; }
function evPending(){ const d=evDef(); return !!(d && d.ch && !d.auto && S.choice==null); }

function genEvent(){
  S.ev=null; S.evResult=null; S.choice=null; S.rain=false;
  const hs=here(), ks=kids(), dd=D();
  const mk=id=>({id, n:hs.length?pick(hs):null, k:ks.length?pick(ks):null});
  if(S.rescueDay===S.day){ S.ev=mk('rescue'); return; }
  const forced=S.sched.filter(x=>x.day===S.day && x.type.indexOf('ev:')===0);
  if(forced.length){ forced.slice(1).forEach(x=>x.day++); S.ev=mk(forced[0].type.slice(3)); runAuto(); return; }
  if(S.day===1){ S.ev={id:'filler',text:'ทุกแอพนั่งเบียดกันในแฟลชไดรฟ์ มองไวรัสสีเขียวกินเดสก์ท็อปข้างนอกทีละพิกเซล ต้องแบ่งแรมกับแบตให้ดี ไม่รู้ว่าจะต้องอยู่อีกนานแค่ไหน'}; S.evResult=''; return; }
  const pool=EVENTS.filter(e=>!e.forced && !(e.once&&S.used[e.id]) && !(e.max&&(S.used[e.id]||0)>=e.max) && e.cond());
  if(!pool.length || Math.random()<.15/dd.bad){ const n=hs.length?nm(pick(hs)):'ใครสักตัว'; S.ev={id:'filler',text:pick(FILLER)(n)}; S.evResult=''; return; }
  const wt=e=>(e.w||1)*(BAD_EV.has(e.id)?dd.bad:1)*(GOOD_EV.has(e.id)?1/dd.bad:1);
  const tot=pool.reduce((a,e)=>a+wt(e),0); let r=Math.random()*tot, e=pool[0];
  for(const x of pool){ r-=wt(x); if(r<=0){ e=x; break; } }
  S.used[e.id]=(S.used[e.id]||0)+1; S.ev=mk(e.id); if(e.id==='rain') S.rain=true; runAuto();
}
function runAuto(){ const d=evDef(); if(d && d.auto){ S.evResult=d.auto(S.ev); logIt(S.evResult); } }
function chooseEvent(i){
  const d=evDef(); if(!d || d.auto) return;
  const c=d.ch[i]; if(!c || (c.ok && !c.ok())) return;
  S.choice = S.choice===i ? null : i; sfx('click'); saveGame(); renderBook(false);
}

/* ================= END OF DAY ================= */
function endDay(){
  if(evPending()){ S.page=pagesFor().indexOf('event'); NOTE='ยังไม่ได้เลือกว่าจะทำอะไรกับเหตุการณ์วันนี้'; sfx('full'); renderBook(true); return; }
  const dd=D(), rep=[];
  Object.keys(S.m).forEach(id=>{
    const m=S.m[id]; if(!m.alive||!m.here||m.away) return;
    const r=S.rat[id]||{};
    if(r.f && S.food>0){ S.food--; m.hunger=0; } else m.hunger++;
    if(r.w && S.water>0){ S.water--; m.thirst=0; } else m.thirst++;
    if(m.sick) m.sickDays++;
    if(m.stress){ m.stressDays++; if(m.stressDays>=4){ m.stress=false; m.stressDays=0; sick(id); rep.push({t:`${nm(id)}ค้างจนแอบออกไปเดินในเขตติดเชื้อทั้งคืน แล้วติดไวรัสกลับมา`,c:'bad'}); } }
    let why=null;
    if(m.thirst>=dd.thirst) why='แบตหมด'; else if(m.hunger>=dd.hunger) why='แรมไม่พอ'; else if(m.sick && m.sickDays>=dd.sickDie) why='ไวรัสที่ไม่ได้สแกน';
    if(why){ m.alive=false; S.dead.push(id); rep.push({t:`${nm(id)}แครชเพราะ${why} และถูกลบหายไปในคืนนั้น`,c:'bad',log:1}); }
  });
  const d=evDef();
  if(d && !d.auto && d.ch && S.choice!=null){
    const c=d.ch[S.choice], f0=S.food, w0=S.water;
    const res = (c.ok && !c.ok()) ? `สุดท้ายทำไม่ได้ เพราะ${c.need}` : c.run(S.ev);
    S.evResult=res;
    const cls = S.food<f0||S.water<w0 ? 'bad' : (S.food>f0||S.water>w0) ? 'good' : '';
    rep.unshift({t:`[เมื่อวาน: ${c.l}] ${res}`,c:cls,log:1});
  }
  if(S.exp){ S.exp.days--; if(S.exp.days<=0) resolveExp(rep); }
  if(S.plan && !S.over){ const p=S.plan, m=S.m[p.id];
    if(m && m.alive && !m.away && !m.sick && S.noExp!==S.day){
      m.away=true; const dest=pickDest();
      S.exp={id:p.id,dest:dest.id,days:rand(dest.days[0],dest.days[1]),gear:p.gear};
      if(p.gear) S.tools[p.gear]=false;
      rep.push({t:`${nm(p.id)}${p.gear?`ใช้${DEF[p.gear].n}`:'มือเปล่า'}ออกไปข้างนอกตั้งแต่ตีห้า ไม่รู้จะไปเจออะไร`}); } }
  S.plan=null;
  if(S.catAway>0){ S.catAway--; if(S.catAway===0) catReturn(rep); }
  S.rat={};
  S.day++;
  S.sched.filter(x=>x.day===S.day).forEach(x=>{
    if(x.type==='donate') rep.push({t:'อาสาส่งแพ็กเสบียงเข้ามาทางพอร์ต บอกว่าเห็นจากในโซเชียล'+fx(3,3),c:'good',log:1});
    if(x.type==='karma') rep.push({t:'แอพเล็ก ๆ ที่แชทเคยให้แรม กลับมาพร้อมแบตกับแรมแผงใหญ่'+fx(2,3),c:'good',log:1});
  });
  if(S.flags.croc && S.crocUntil===S.day-1) rep.push({t:`กระดานระบบแจ้งว่า ${S.flags.croc}ถูกแอนตี้ไวรัสจับได้แล้ว เกมเสียใจนิดหน่อย`});
  Object.keys(S.m).forEach(id=>{ const m=S.m[id]; if(!m.alive||!m.here||m.away) return;
    if(m.thirst>=dd.thirst-2) rep.push({t:`${nm(id)}ไม่ได้ชาร์จมา ${m.thirst} วัน จอเริ่มหรี่ อาการน่าเป็นห่วง`,c:'bad'});
    else if(m.hunger>=dd.hunger-2) rep.push({t:`${nm(id)}ไม่ได้แรมมา ${m.hunger} วัน ค้างบ่อยขึ้น`,c:'bad'});
    if(m.sick && m.sickDays>=dd.sickDie-2) rep.push({t:`${nm(id)}ไวรัสลามหนักมาก ต้องสแกนด่วน`,c:'bad'}); });
  rep.filter(r=>r.log).forEach(r=>logIt(r.t));
  S.report=rep; S.page=0; focusId=null; BUB=null; NOTE='';
  const living=Object.keys(S.m).filter(id=>S.m[id].alive&&S.m[id].here);
  const prevDay=S.day-1;

  [[.82,.14],[.92,.32],[.7,.06]].forEach(([fx2,fy],i)=>{ const x=w*fx2, y=h*fy; if(Math.hypot(w-x,y)<vr) drawVirus(c,x,y+(REDUCED?0:Math.sin(t*3+i)*5),Math.min(60,h*.13),t+i); });
  const by=h-40-8, cs=Math.min(30,h*.07);
  ['ek','nid','praew','ton'].forEach((id,i)=>{ const x=w*.62+i*cs*2.3, run=REDUCED?0:Math.sin(t*6+i)*3; drawChar(c,id,x+run,by,cs,'walk','stress',t*1.4+i); });
  drawCat(c,w*.62-cs*1.6,by,cs*1.2,false,t);
  if(!REDUCED && Math.floor(t*10)%23===0){ c.fillStyle='rgba(111,208,106,.25)'; for(let i=0;i<5;i++) c.fillRect(0,((t*997+i*131)%1)*h,w,4+i); }
  c.fillStyle='rgba(0,0,0,.05)'; for(let y=0;y<h;y+=3) c.fillRect(0,y,w,1);
}

/* ---------------- misc ---------------- */
function nightThen(cb,day,sub){
  const n=$('night');
  n.innerHTML=`<div class="boot"><b>Ctrl+Alt+รอด BIOS v6.0</b><br>ตรวจสอบหน่วยความจำ ... <span class="ok">OK</span><br>ตรวจสอบแฟลชไดรฟ์ (E:) ... <span class="ok">OK</span><br>${sub||''}<br>กำลังเริ่มวันที่ ${day+1} <span class="cur"></span></div>`;
  n.hidden=false; n.style.animation='none'; void n.offsetHeight; n.style.animation='';
  sfx('night'); setTimeout(()=>sfx('boot'),900); setTimeout(cb,800); setTimeout(()=>{ n.hidden=true; },1750);
}
function saveGame(){ if(S && !S.over) lsSet(LS+'save',S); }
const SPK=m=>`<svg class="spk" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 8h4l6-5v16l-6-5H2z" fill="#1a1a1a"/>${m?'<path d="M15 8l5 6M20 8l-5 6" stroke="#b3261e" stroke-width="2.4" stroke-linecap="round"/>':'<path d="M15 7.5c1.8 1.4 1.8 5.6 0 7M17.6 4.8c3.2 2.8 3.2 9.6 0 12.4" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>'}</svg>`;
function updateMute(){ const b=$('mutebtn'); if(b) b.innerHTML=SPK(muted); }

/* ---------------- install as app (PWA build only) ---------------- */
let INSTALL_EV=null;
const STANDALONE = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone===true;
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function canInstall(){ return !!window.PWA_MODE && !STANDALONE() && (!!INSTALL_EV || IOS); }
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); INSTALL_EV=e; if(phase==='intro') renderIntro(); });
addEventListener('appinstalled',()=>{ INSTALL_EV=null; if(phase==='intro') renderIntro(); });

/* ---------------- fullscreen + landscape ---------------- */
const COARSE = matchMedia('(pointer:coarse)').matches;
const fsEl = () => document.fullscreenElement||document.webkitFullscreenElement;
const FS_OK = !!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function goFS(){ const d=document.documentElement; try{ const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:'hide'}); const lock=()=>{ try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(err){} }; if(p&&p.then) p.then(lock).catch(()=>{}); else lock(); }catch(err){} }
function exitFS(){ try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(err){} }
function syncFS(){ const on=!!fsEl(); $('fsico').setAttribute('d', on?'M7 2v5H2M13 2v5h5M18 13h-5v5M2 13h5v5':'M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5'); $('fsbtn').setAttribute('aria-label',on?'ออกจากเต็มจอ':'เต็มจอ'); setTimeout(onResize,120); }
if(!FS_OK){ $('fsbtn').hidden=true; const rb=document.querySelector('#rotate .b95'); if(rb) rb.hidden=true; }
document.addEventListener('fullscreenchange',syncFS); document.addEventListener('webkitfullscreenchange',syncFS);

/* ================= INPUT ================= */
$('roomc').addEventListener('click',roomTap);
document.addEventListener('pointerdown',e=>{ const dg=e.target.closest('[data-drag]'); if(dg && phase==='day') dragStart(e,dg.dataset.drag); });
document.addEventListener('pointermove',e=>{ if(DRAG) dragMove(e); });
document.addEventListener('pointerup',e=>{ if(DRAG) dragEnd(e); });
$('stage').addEventListener('click',e=>{
  audioInit(); if(!MUS.mode && !muted) music(phase==='sum'?'day':phase);
  const a=e.target.closest('[data-act]');
  if(a){ const act=a.dataset.act; sfx('click');
    if(act==='startmenu'){ MENU=!MENU; DLG=null; if(COARSE && !fsEl()) goFS(); renderIntro(); }
    else if(act==='pickdiff'){ if(phase!=='intro'){ MENU=false; DLG='diff'; renderIntro(); } else { MENU=false; DLG='diff'; renderIntro(); } }
    else if(act==='startdiff'){ diffKey=a.dataset.d; lsSet(LS+'diff',diffKey); DLG=null; MENU=false; renderIntro(); playComic(()=>startScavenge()); }
    else if(act==='closewarn'){ const w=$('titlewin'); if(w){ w.classList.remove('pop'); w.classList.add('bye'); } setTimeout(()=>{ WARN='closed'; if(phase==='intro') renderIntro(); },330); }
    else if(act==='openwarn'){ WARN='new'; MENU=false; renderIntro(); }
    else if(act==='howto'||act==='gallery'||act==='settings'){ MENU=false; DLG=act; renderIntro(); }
    else if(act==='dlgclose'){ DLG=null; renderIntro(); }
    else if(act==='continue'){ S=lsGet(LS+'save',null); MENU=false; if(S){ diffKey=S.diff; if(!S.log) S.log=[]; if(S.choice===undefined) S.choice=null; bookOpen=true; renderDay(); } else renderIntro(); }
    else if(act==='mute'){ muted=!muted; lsSet(LS+'mute',muted); updateMute(); if(muted) music(null); else { MUS.mode=null; music(phase==='sum'?'day':phase); } if(phase==='intro') renderIntro(); else if(phase==='day') renderDay(true); }
    else if(act==='fs'){ if(fsEl()) exitFS(); else goFS(); }
    else if(act==='install'){ MENU=false; if(INSTALL_EV){ const ev=INSTALL_EV; INSTALL_EV=null; ev.prompt(); (ev.userChoice||Promise.resolve()).then(()=>renderIntro()); renderIntro(); } else { DLG='iosinstall'; renderIntro(); } }
    else if(act==='tutreset'){ lsDel(LS+'tut-scv'); lsDel(LS+'tut-day'); a.textContent='จะสอนใหม่รอบหน้า'; }
    else if(act==='day1'){ genEvent(); saveGame(); bookOpen=true; renderDay(); }
    else if(act==='endday') endDay();
    else if(act==='closebook'){ bookOpen=false; focusId=null; applyBook(); }
    else if(act==='openbook'){ bookOpen=true; applyBook(); renderBook(true); }
    else if(act==='boatleave'){ S.over='boat'; finish('boat'); }
    else if(act==='menu'){ MENU=false; DLG=null; renderIntro(); }
    return; }
  if(phase!=='day' || !S) return;
  const t=e.target;
  const nv=t.closest('[data-nav]'); if(nv){ const pages=pagesFor(); if(+nv.dataset.nav>0 && pages[S.page]==='event' && evPending()) return; NOTE=''; focusId=null; S.page=clamp(S.page+ +nv.dataset.nav,0,pages.length-1); sfx('page'); renderBook(true); return; }
  const ch=t.closest('[data-ch]'); if(ch){ NOTE=''; chooseEvent(+ch.dataset.ch); return; }
  const rt=t.closest('[data-rat]'); if(rt){ const id=rt.dataset.id, r=S.rat[id]||(S.rat[id]={}); r[rt.dataset.rat]=!r[rt.dataset.rat]; sfx('click'); renderBook(false); return; }
  const qa=t.closest('[data-qall]'); if(qa){ const k=qa.dataset.qall;
    if(k==='x'){ S.rat={}; }
    else { let left = k==='f' ? S.food : S.water; Object.values(S.rat).forEach(r=>{ if(r[k]) left--; });
      here().forEach(id=>{ const r=S.rat[id]||(S.rat[id]={}); if(!r[k] && left>0){ r[k]=true; left--; } }); }
    sfx('click'); renderBook(false); return; }
  const md=t.closest('[data-med]'); if(md){ const id=md.dataset.med; if(S.tools.med>0){ S.tools.med--; S.m[id].sick=false; S.m[id].sickDays=0; sfx('good'); BUB={id,text:'สแกนแล้ว หายแล้ว',t0:performance.now()/1000}; } renderBook(false); return; }
  const pw=t.closest('[data-pw]'); if(pw){ const id=pw.dataset.pw; if(S.plan&&S.plan.id===id) S.plan=null; else S.plan={id, gear:S.plan?S.plan.gear:(['boat','raft','ring'].find(g=>S.tools[g])||null)}; sfx('click'); renderBook(false); return; }
  const gr=t.closest('[data-gear]'); if(gr && S.plan){ S.plan.gear=gr.dataset.gear||null; sfx('click'); renderBook(false); return; }
});
function onResize(){
  if(phase==='scv' && SC) layoutMap();
  else if(phase==='day' && S){ layoutRoom(); drawRoomCanvas(); }
  else if(phase==='end'){ const cv=$('endc'); if(cv) cv.width=0; drawEnd(performance.now()/1000); }
  else if(phase==='intro') sizeBg();
  if(COACH_RENDER) COACH_RENDER();
}
let rT=0; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(onResize,80); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ SPR.clear(); onResize(); });

/* ================= BOOT ================= */
function boot(data){
  if(data && data.S && data.phase==='day'){ S=data.S; diffKey=S.diff; if(!S.log) S.log=[]; if(S.choice===undefined) S.choice=null; renderDay(); return; }
  renderIntro();
}
try{ window.claude?.hot?.snapshot?.(()=> (phase==='day' && S ? {phase,S} : {})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});

})();
</script>
